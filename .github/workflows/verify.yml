name: 校验

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 同一分支的新推送取消上一轮未完成的任务，省 runner 也省等待
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 全量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm

      - name: 安装依赖
        # 门禁不需要 Electron 运行时（构建与单测都不碰它），跳过 250MB 下载。
        # 与 release.yml 的 build 步骤同一口径：只有真出安装包才需要二进制。
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # verify 是非 fail-fast 的：一次跑完 15 项再统一报，失败时日志里能直接看到全部欠账
      - name: pnpm verify
        run: pnpm verify
