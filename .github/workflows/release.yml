# 发版：版本号提升合并到 main 时自动创建 tag 与 Release，并构建三平台安装包。
#
# 两种入口：
#   1. main 上的 package.json 版本还没打过 tag → 视为发版，建 tag + 构建 + 发布；
#   2. 推送 v* tag → 重建既有版本的产物（修 CI 或补资产时用）。
# main 上版本已打过 tag 的普通合并不会重复发版。
#
# ⚠️ 版本号唯一来源是**根 package.json**（apps/desktop 的 version 由它注入），
# bump 只改那一处，避免两处版本对不上而发布了一个错版本号。
#
# ⚠️ Release 正文来自 CHANGELOG.md 的 `## [<版本号>]` 小节。缺小节时 version job
# 直接失败——宁可发不出去，也不要发出一个只有提交标题、用户看不懂改了什么 的版本。
name: 发版

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # 推 tag 时必须与 package.json 一致，否则会发出一个版本号对不上的包
            if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} 与 package.json 版本 ${version} 不一致"
              exit 1
            fi
            release=true
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} 已存在，本次不发版（bump 版本号后再合并才会发）"
            release=false
          else
            release=true
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"

          # 要发版就必须有写好的版本说明：缺小节时在这里失败，
          # 而不是等三个平台各打二十分钟包之后再发出一个没说明的 Release。
          if [[ "${release}" == "true" ]] &&
            ! node scripts/release-notes.mjs "${version}" - >/dev/null; then
            echo "::error::CHANGELOG.md 缺少 ${version} 的小节。先补「## [${version}] - <日期>」再发版。"
            exit 1
          fi

  verify:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      # 门禁不打包 Electron，跳过二进制下载省时间
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build:
    needs: [version, verify]
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # 显式给 --win：不写时电子构建器按宿主平台推导，一旦 runner 镜像
            # 变化（历史上 macOS runner 从 x64 换到 arm64）产物会悄悄变样。
            args: --win --x64
            # 只取安装包：release/*.exe 会把 NSIS 的临时 __uninstaller.exe 也捞进来
            artifacts: |
              apps/desktop/release/*-setup.exe
          - os: macos-latest
            name: macos
            # x64 + arm64 双架构：配置里已列两个 arch，这里再显式声明一次，
            # 避免「配置改了但 CI 没跟上」打出单架构包
            args: --mac --x64 --arm64
            artifacts: |
              apps/desktop/release/*.dmg
          - os: ubuntu-latest
            name: linux
            args: --linux --x64
            artifacts: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder 自带 Electron zip 下载，npm postinstall 的二进制用不上
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Windows / Linux 产物是未签名的：显式关掉身份发现，避免 runner 上残留的
      # 证书产出一个「半签名」包——它的行为会与本地构建不一致，很难排查。
      # macOS 走配置里的 identity: '-'（ad-hoc），它绕过身份发现，不受此变量影响。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 复用与本地一致的打包链（build → 插件产物 → electron-builder），
      # 平台参数由矩阵决定，经 pnpm 的 `--` 透传到链末的 electron-builder。
      #
      # 必须带 `--publish never`（脚本 docvi:dist:ci 里已写死）：electron-builder
      # 只要检测到 CI 环境变量就会在**产物生成之后**尝试发布，拿不到 token 就整步
      # 报错——包其实已经打好了，却因为收尾失败被判为构建失败（实测三平台同时红）。
      # 配置里的 `publish: null` 是第一道闸，这是第二道。
      - name: 构建安装包
        run: pnpm docvi:dist:ci -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: docvi-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 取出本版本说明
        id: notes
        shell: bash
        run: |
          # 正文落文件而不是塞进 shell 变量：说明里有反引号、引号和 Markdown，
          # 走变量传递迟早踩转义。version job 已保证这一节能取到，这里取不到
          # 说明是异常（比如 publish 与 version 读到的不是同一个提交），直接失败。
          if node scripts/release-notes.mjs "${TAG#v}" release-notes.md; then
            echo "file=release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::error::取不到 ${TAG#v} 的版本说明，拒绝发出没有说明的 Release。"
            exit 1
          fi
      - name: 发布 GitHub Release
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 已有该 tag（重跑 / 补资产场景）：替换资产，并刷新正文，
            # 这样事后修订过的更新日志也能补到已发布的 Release 上
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "docvi ${TAG}" \
              --notes-file release-notes.md
          fi
