<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" role="img" aria-label="docvi">
  <defs>
    <linearGradient id="dv-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2b2e35"/>
      <stop offset="1" stop-color="#16181d"/>
    </linearGradient>
    <linearGradient id="dv-page" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f9cd72"/>
      <stop offset="1" stop-color="#e0a03d"/>
    </linearGradient>
    <clipPath id="dv-clip">
      <rect x="6.8" y="5.4" width="15.4" height="18.6" rx="2.6"/>
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#dv-bg)"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.45" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <rect x="10.4" y="8.2" width="15.4" height="18.6" rx="2.6" fill="#e8b055" fill-opacity="0.34"/>
  <rect x="8.6" y="6.8" width="15.4" height="18.6" rx="2.6" fill="#e8b055" fill-opacity="0.62"/>
