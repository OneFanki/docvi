    <g fill="#3a2a0e" fill-opacity="0.42">
      <rect x="9.6" y="8.600000000000001" width="7.4" height="1.5" rx="0.75"/>
      <rect x="9.6" y="11.4" width="9.8" height="1.5" rx="0.75"/>
      <rect x="9.6" y="14.200000000000001" width="8.2" height="1.5" rx="0.75"/>
      <rect x="9.6" y="17" width="5.6" height="1.5" rx="0.75"/>
    </g>
    <g transform="rotate(-34 14.5 14.700000000000001)">
      <rect x="5.1" y="18.2" width="17.6" height="4.4" rx="2.2" fill="#1b1d22"/>
