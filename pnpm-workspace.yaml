allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: true
# pnpm workspace（设计见 docs/architecture/adr/0002-packages-monorepo.md）
#
# packages/*：平台包（server / shared / renderer-core / editor / plugin-api / plugin-runtime）；
# plugins/*：预设插件包（协议 v1：plugin.json + src/ + docs/，产物 dist/）；
# apps/*：应用（desktop = 唯一渲染层，同时产出桌面与容器两个宿主变体）。
packages:
  - packages/*
  - plugins/*
  - apps/*
# pnpm workspace + 构建脚本审批（pnpm ≥10.8 的配置家在这里）
#
# onlyBuiltDependencies：放行依赖的 postinstall 构建脚本。
# - esbuild 0.21 依赖 postinstall 下载本机二进制；不放行会导致 vite 报找不到本机二进制。
# - electron 需要 postinstall 下载对应平台二进制；不放行则 desktop 无法启动。
onlyBuiltDependencies:
  - esbuild
  - electron
  - electron-winstaller
# 组件包与 mermaid 全家由渲染层的 vite 消费；pnpm 默认不提升传递依赖时，
# 解析链可能取不到 CJS 包（dayjs 等被原样 @fs 伺服会报 default 导出缺失而白屏）。
# 全部提升到顶层解决；随包化收敛后再评估是否可去掉。
shamefullyHoist: true
