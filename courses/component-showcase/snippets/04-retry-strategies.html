<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { background: #f7f8fb; color: #2f3242; padding: 14px 16px 12px; min-height: 100vh; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .hint { color: #5c6273; }
  button { border: 1px solid #c9cede; background: #fff; color: #3b4054; border-radius: 8px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: #7c72e8; color: #5a4fd8; }
  .tracks { display: flex; flex-direction: column; gap: 10px; }
  .track { border: 1px solid #dfe2ec; border-radius: 10px; background: #fff; padding: 10px 12px 6px; }
  .track h2 { margin: 0 0 2px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .track h2 b { font-weight: 600; color: #5a4fd8; font-variant-numeric: tabular-nums; }
  .track .desc { margin: 0 0 8px; font-size: 11.5px; color: #858b9e; }
  .lane { position: relative; height: 34px; border-bottom: 1px solid #d4d8e6; }
  .tick { position: absolute; bottom: 0; width: 3px; height: 15px; background: #7c72e8; border-radius: 2px; opacity: 0; transition: opacity .18s; }
  .tick.on { opacity: 1; }
  .axis { position: relative; height: 16px; font-size: 10.5px; color: #7a8095; }
  .axis span { position: absolute; transform: translateX(-50%); }
  .foot { margin: 10px 0 0; font-size: 11.5px; color: #858b9e; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="bar">
    <div class="hint">同一场故障（第 0 秒起）在 15 秒观察窗内的重试点对比</div>
    <button id="replay" type="button">重放对比</button>
  </div>
  <div class="tracks">
    <section class="track">
      <h2>固定间隔重试 <b><span data-count="fixed">0</span> 次</b></h2>
      <p class="desc">每 2 秒重试一次：无论对端是否恢复，都在持续占用请求配额。</p>
      <div class="lane" data-mode="fixed"></div>
      <div class="axis" data-mode="fixed"></div>
    </section>
    <section class="track">
      <h2>指数退避重试 <b><span data-count="backoff">0</span> 次</b></h2>
      <p class="desc">间隔 1s → 2s → 4s → 8s：给对端恢复的窗口，15 秒内只重试 4 次。</p>
      <div class="lane" data-mode="backoff"></div>
      <div class="axis" data-mode="backoff"></div>
    </section>
  </div>
  <p class="foot">时间轴单位：秒（0–15s）。竖线 = 一次重试发生；点「重放对比」重新播放一遍。</p>
</div>
<script>
  var WINDOW = 15;
  var SCALE = 150; // 每 1 秒对应 150ms 播放时长，15 秒窗约 2.3 秒播完
  var attempts = {
    fixed: [2, 4, 6, 8, 10, 12, 14],
    backoff: [1, 3, 7, 15],
  };

  function pos(t) { return (t / WINDOW) * 100; }

  document.querySelectorAll('.lane').forEach(function (lane) {
    var mode = lane.dataset.mode;
    attempts[mode].forEach(function (t) {
      var tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.left = 'calc(' + pos(t) + '% - 1.5px)';
      lane.appendChild(tick);
    });
  });

  document.querySelectorAll('.axis').forEach(function (axis) {
    var ticks = [0, 5, 10, 15];
    ticks.forEach(function (t, index) {
      var label = document.createElement('span');
      label.textContent = t + 's';
      label.style.left = pos(t) + '%';
      label.style.transform = index === 0 ? 'none' : index === ticks.length - 1 ? 'translateX(-100%)' : 'translateX(-50%)';
      axis.appendChild(label);
    });
  });

  var timers = [];
  function play() {
    timers.forEach(clearTimeout);
    timers = [];
    document.querySelectorAll('.tick').forEach(function (tick) { tick.classList.remove('on'); });
    document.querySelectorAll('[data-count]').forEach(function (el) { el.textContent = '0'; });
    Object.keys(attempts).forEach(function (mode) {
      attempts[mode].forEach(function (t, index) {
        timers.push(setTimeout(function () {
          var lane = document.querySelector('.lane[data-mode="' + mode + '"]');
          lane.children[index].classList.add('on');
          document.querySelector('[data-count="' + mode + '"]').textContent = String(index + 1);
        }, t * SCALE));
      });
    });
  }

  document.getElementById('replay').addEventListener('click', play);
  play();
</script>
</body>
</html>
